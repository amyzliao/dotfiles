bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

set -g history-limit 100000
# tmux < 3.5 waits 500ms after Esc, which makes vim modes sluggish
set -sg escape-time 10

# enable copy-pasting from terminal using vim-like mechanics
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer
# copy to the system clipboard: pbcopy on macOS. Elsewhere (remote sandboxes), copy-pipe with no command
# still makes tmux send the text to the terminal via OSC 52, and VS Code puts it on the Mac clipboard.
if-shell 'command -v pbcopy' {
    bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
}

# mouse mode settings
set -g mouse on
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# forward terminal bells
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# g table
bind -T copy-mode-vi g switch-client -T gx-table
bind -T gx-table g send-keys -X history-top
bind -T gx-table _ send-keys -X end-of-line \; send-keys -X previous-space \; send-keys -X next-space-end
## Vim-like URL opening with gx in copy mode.
## macOS: open. Remote VS Code: $BROWSER (VS Code's helper, opens on the Mac). Otherwise: copy the URL.
bind -T gx-table x run-shell '
    # #{copy_cursor_line} = exact line under the copy-mode cursor, expanded by
    # tmux at fire time (immune to scrolling / wrapping / line-number math)
    LINE="#{copy_cursor_line}"
    URL=$(printf "%s\n" "$LINE" | grep -oE "(https?|ftp|file)://[^[:space:]]*" | head -1)
    if [ -n "$URL" ]; then
        if [ "$(uname)" = Darwin ]; then
            open "$URL"
        elif [ -n "$BROWSER" ]; then
            "$BROWSER" "$URL"
        else
            tmux set-buffer -w "$URL"
            tmux display-message "Copied: $URL"
            exit
        fi
        tmux display-message "Opening: $URL"
    else
        tmux display-message "No URL found"
    fi
'

# VS Code remote sets these per connection; refresh them on attach so $BROWSER / `code` keep working in new panes
# (tmux defaults listed explicitly instead of -ga so reloading the config doesn't append duplicates)
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY BROWSER VSCODE_IPC_HOOK_CLI"

# --- VS Code integration (keys sent by VS Code keybindings, see keybindings.json) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-left-length 40

# new windows/panes open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# cmd+w: close pane. Confirm if it's the session's last pane (closing it ends the session),
# or if something other than a shell is running in it.
bind X {
    if -F '#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}' {
        confirm-before -p "close last pane and end session #S? (y/n)" kill-pane
    } {
        if -F '#{m/r:^-?(zsh|bash|sh)$,#{pane_current_command}}' kill-pane {
            confirm-before -p "kill #{pane_current_command}? (y/n)" kill-pane
        }
    }
}

# true color: VS Code's terminal supports 24-bit color, tell tmux so it doesn't downsample to 256
set -as terminal-features 'xterm*:RGB'
